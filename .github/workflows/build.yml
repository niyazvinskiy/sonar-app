name: Build
# Сборка Sonar для Android, Windows, Linux и macOS. Пуш в main собирает черновик
# (релиз «draft»), тег vX.Y.Z выпускает настоящий релиз: его находят автообновление
# приложения и кнопки «Скачать» на сайте.
on:
  workflow_call:
    inputs:
      upload-artifact:
        type: boolean
        default: true
      tag-name:
        type: string
        default: "draft"
      channel:
        type: string
        default: "dev"

env:
  IS_GITHUB_ACTIONS: 1
  CHANNEL: "${{ inputs.channel }}"
  FLUTTER_VERSION: '3.38.5'
  UPLOAD_ARTIFACT: "${{ inputs.upload-artifact }}"
  TAG_NAME: "${{ inputs.tag-name }}"
  TARGET_NAME_gz: "Sonar-Linux-x64-AppImage.tar"
  TARGET_NAME_AppImage: "Sonar-Linux-x64"
  TARGET_NAME_deb: "Sonar-Debian-x64"
  TARGET_NAME_apk: "Sonar-Android"
  TARGET_NAME_exe: "Sonar-Windows-Setup-x64"
  TARGET_NAME_zip: "Sonar-Windows-Portable-x64"
  TARGET_NAME_dmg: "Sonar-MacOS"
  TARGET_NAME_pkg: "Sonar-MacOS-Installer"

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - name: Prepare
        run: make linux-amd64-prepare
      - name: Analyze Sonar
        run: dart analyze lib/sonar
      - name: Test
        run: flutter test

  build:
    permissions: write-all
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android-apk
            os: ubuntu-latest
            targets: apk

          - platform: windows
            os: windows-latest
            aarch: amd64
            targets: exe,zip

          - platform: linux
            os: ubuntu-22.04
            aarch: amd64
            targets: deb,gz,AppImage

          - platform: macos
            os: macos-15
            aarch: universal
            targets: dmg
    runs-on: ${{ matrix.os }}
    env:
      ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Clean up disk space
        if: startsWith(matrix.platform,'android')
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          rm -rf ~/.gradle/caches
          sudo apt-get autoremove -y && sudo apt-get clean
          df -h

      - name: Setup Java
        if: startsWith(matrix.platform,'android')
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        if: startsWith(matrix.platform,'android')
        with:
          packages: platform-tools

      - name: Cache Gradle
        uses: actions/cache@v5
        if: startsWith(matrix.platform,'android')
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup dependencies
        run: |
          make ${{ matrix.platform }}-install-deps
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      # Inno Setup 6.7: тёмный мастер со своим фоном. Сборщик ищет его только в стандартной папке
      - name: Install Inno Setup 6.7
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP\innosetup.exe"
          $dir = "C:\Program Files (x86)\Inno Setup 6"
          Start-Process "$env:RUNNER_TEMP\innosetup.exe" -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/ALLUSERS', "/DIR=`"$dir`""
          # у ISCC.exe пустой ProductVersion: версию берём из реестра и FileVersion, только для журнала
          $reg = Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1' -ErrorAction SilentlyContinue
          "Inno Setup: реестр $($reg.DisplayVersion), ISCC $((Get-Item "$dir\ISCC.exe").VersionInfo.FileVersion)"
          "INNO_SETUP_PATH=$dir" >> $env:GITHUB_ENV

      # Один и тот же ключ подписи из секретов: иначе Android не поставит обновление поверх
      - name: Setup Android Signing Properties
        if: ${{ startsWith(matrix.platform,'android') && env.ANDROID_SIGNING_KEY != '' }}
        run: |
          echo "${{ secrets.ANDROID_SIGNING_KEY }}" | base64 --decode > android/key.jks
          echo "storeFile=$(pwd)/android/key.jks" > android/key.properties
          echo "storePassword=${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}" >> android/key.properties

      - name: Prepare for ${{ matrix.platform }}
        run: |
          make ${{ matrix.platform }}-prepare

      - name: Build ${{ matrix.platform }}
        env:
          SONAR_API: ${{ secrets.SONAR_API }}
        run: |
          make ${{ matrix.platform }}-release

      - name: Copy to out Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Get-ChildItem -Path dist -Recurse | Select-Object FullName
          New-Item -ItemType Directory -Path "out" -Force | Out-Null
          $targets = "${{ matrix.targets }}".Split(',')
          foreach ($ext in $targets) {
            $ext = $ext.Trim()
            $targetName = (Get-Item "env:TARGET_NAME_$ext").Value
            $files = Get-ChildItem -Path dist -Recurse -Filter "*.$ext"
            foreach ($file in $files) {
              Move-Item -Path $file.FullName -Destination (Join-Path "out" "$targetName.$ext") -Force
            }
          }
          Get-ChildItem -Path out

      - name: Copy to out Android APK
        if: matrix.platform == 'android-apk'
        run: |
          mkdir out
          ls -R ./build/app/outputs
          cp ./build/app/outputs/flutter-apk/*arm64-v8a*.apk out/${TARGET_NAME_apk}-arm64.apk || echo "no arm64 apk"
          cp ./build/app/outputs/flutter-apk/*armeabi-v7a*.apk out/${TARGET_NAME_apk}-arm7.apk || echo "no arm7 apk"
          cp ./build/app/outputs/flutter-apk/*x86_64*.apk out/${TARGET_NAME_apk}-x86_64.apk || echo "no x64 apk"
          cp ./build/app/outputs/flutter-apk/app-release.apk out/${TARGET_NAME_apk}-universal.apk || echo "no universal apk"

      - name: Copy to out unix
        if: startsWith(matrix.platform,'linux') || matrix.platform == 'macos'
        run: |
          ls -R dist/
          mkdir out
          for EXT in $(echo ${{ matrix.targets }} | tr ',' '\n'); do
            KEY=TARGET_NAME_${EXT}
            FILENAME=${!KEY}
            mv dist/*/*.$EXT out/${FILENAME}.$EXT
            [[ "$EXT" != "gz" ]] && chmod +x out/${FILENAME}.$EXT || true
          done
          ls -la out

      - name: Upload Artifact
        if: env.UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ${{matrix.platform}}
          path: ./out
          retention-days: 7

  update-draft:
    permissions: write-all
    if: ${{ !cancelled() && inputs.upload-artifact && inputs.tag-name == 'draft' }}
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download Artifact
        uses: actions/download-artifact@v7
        with:
          merge-multiple: true
          pattern: "*"
          path: ./out/
      - name: Delete Current Draft Assets
        uses: 8Mi-Tech/delete-release-assets-action@main
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: 'draft'
          deleteOnlyFromDrafts: false
      - name: Release message
        run: sed 's|RELEASE_TAG|draft|g' ./.github/release_message.md > release.md
      - name: Create or Update Draft Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./out/*
          name: 'Черновая сборка'
          tag_name: 'draft'
          body_path: './release.md'
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false

  # Выпуск выходит и без macOS: облачный Mac у GitHub иногда так и не выделяется.
  # Windows и Android обязательны, без них выпуск не публикуется
  upload-release:
    permissions: write-all
    if: ${{ !cancelled() && inputs.upload-artifact && inputs.tag-name != 'draft' }}
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download Artifact
        uses: actions/download-artifact@v7
        with:
          merge-multiple: true
          pattern: "*"
          path: ./out/
      - name: Check required files
        run: |
          for f in Sonar-Windows-Setup-x64.exe Sonar-Android-arm64.apk Sonar-Android-arm7.apk Sonar-Android-universal.apk; do
            test -f "./out/$f" || { echo "нет $f, выпуск не публикую"; exit 1; }
          done
          test -f ./out/Sonar-MacOS.dmg || echo "::warning::сборки macOS нет, выпуск без неё"
      - name: Release message
        run: |
          sed 's|RELEASE_TAG|${{ env.TAG_NAME }}|g' ./.github/release_message.md > release.md
          echo "VERSION=${TAG_NAME#sonar-v}" >> $GITHUB_ENV
          ls -la ./out
      # Не prerelease: releases/latest должен указывать на этот выпуск
      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Sonar ${{ env.VERSION }}
          body_path: './release.md'
          files: ./out/*
          prerelease: false
          make_latest: true
