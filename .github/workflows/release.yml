name: Release
on:
  workflow_dispatch:
    inputs:
      tag-name:
        type: string
        required: true
      windows-only:
        type: boolean
        default: true
  push:
    tags:
      # Теги Hiddify (v1.0.0 и дальше) уже есть в форке, поэтому у Sonar свой префикс
      - 'sonar-v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    permissions: write-all
    with:
      upload-artifact: true
      tag-name: "${{ github.event_name == 'workflow_dispatch' && inputs.tag-name || github.ref_name }}"
      windows-only: ${{ github.event_name == 'workflow_dispatch' && inputs.windows-only || false }}
      channel: "${{ github.event_name == 'workflow_dispatch' && 'prod' || github.ref_type == 'tag' && endsWith(github.ref_name, 'dev') && 'dev' || github.ref_type != 'tag' && 'dev' || 'prod' }}"
